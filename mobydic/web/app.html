<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moby-DIC</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2330;--muted:#5d6678;--line:#d9dde5;--accent:#1d5aa0;--accent-ink:#fff;
  --ok:#1a8f55;--warn:#b25b00;--soft:#eaf1fa;--auto:#e3f2ea;--auto-ink:#16653c;--marca:#14427a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151b;--card:#1a1f27;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2c333e;
  --accent:#5b95f0;--accent-ink:#0b0d10;--ok:#3cc483;--warn:#f0a040;--soft:#1c2634;--auto:#18301f;--auto-ink:#7fd9a8;--marca:#0e2f57}}
:root[data-theme="dark"]{--bg:#11151b;--card:#1a1f27;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2c333e;--accent:#5b95f0;--accent-ink:#0b0d10;
  --ok:#3cc483;--warn:#f0a040;--soft:#1c2634;--auto:#18301f;--auto-ink:#7fd9a8;--marca:#0e2f57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:var(--marca);color:#fff}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:40px;height:40px}
.marca h1{font-size:19px;margin:0;letter-spacing:.2px}
.marca .sub{color:#c5d7ee;font-size:12.5px}
header .acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header select,header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
header select option{color:#111}
#cabStatus{font-size:12.5px;color:#ffe3a3}
.app{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px)}
@media (max-width:860px){.app{grid-template-columns:1fr}.fluxo{position:static!important;flex-direction:row;overflow-x:auto;border-right:0!important;border-bottom:1px solid var(--line);min-height:0!important}
  .fluxo .no{min-width:150px}.fluxo .conector{display:none}}
.fluxo{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);min-height:calc(100vh - 60px)}
.no{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.no:hover{background:var(--soft)}
.no.ativo{background:var(--soft);border-color:var(--accent)}
.no.bloqueado{opacity:.45;cursor:default}
.no .bola{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);color:var(--muted);background:var(--card)}
.no.ativo .bola{border-color:var(--accent);color:var(--accent)}
.no.feito .bola{background:var(--ok);border-color:var(--ok);color:#fff}
.no .t{font-weight:600}.no .d{font-size:12px;color:var(--muted)}
.conector{width:2px;height:14px;background:var(--line);margin-left:21px}
.rodape{margin-top:auto;padding-top:18px;font-size:12px;color:var(--muted)}
main{padding:18px 22px 60px;min-width:0}
.etapa{max-width:1200px}
.etapa h2{margin:0 0 4px;font-size:20px}
.etapa .lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.lin{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:8px}
label{color:var(--muted)}
input[type=number],input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
input[type=number]{width:96px}
input[type=text]{min-width:240px;flex:1}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.peq{padding:4px 9px;font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;align-items:center}
.auto{display:inline-flex;align-items:center;gap:6px;background:var(--auto);color:var(--auto-ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.manual{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.auto input,.manual input{margin:0}
.campo{display:grid;grid-template-columns:minmax(160px,230px) auto 1fr;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.campo:last-child{border-bottom:0}
.campo .nome{font-weight:600}
.campo .ajuda{color:var(--muted);font-size:12.5px;grid-column:1/-1;margin-top:-4px}
.nota{color:var(--muted);font-size:12.5px}
.aviso{background:color-mix(in srgb,var(--warn) 14%,transparent);border-left:3px solid var(--warn);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}
.okbox{background:color-mix(in srgb,var(--ok) 12%,transparent);border-left:3px solid var(--ok);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px}
.lista{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lista div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.lista div:hover{background:var(--soft)}
.badge{font-size:12px;color:var(--muted);white-space:nowrap}
.badge.img{color:var(--accent);font-weight:600}.badge.res{color:var(--ok);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.thumbs figure{margin:0}.thumbs img{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
.thumbs figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.metodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-bottom:12px}
.metodo{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
.metodo.sel{border-color:var(--accent);background:var(--soft)}
.metodo.off{opacity:.45;cursor:default}
.metodo .t{font-weight:700}.metodo .d{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--auto);color:var(--auto-ink);margin-left:6px}
canvas.editor{width:100%;display:block;border-radius:8px;border:1px solid var(--line);touch-action:none;cursor:crosshair;background:#000}
table.resumo{border-collapse:collapse;width:100%;font-size:13.5px}
table.resumo td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.resumo td:first-child{color:var(--muted);width:30%}
.orig{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.orig.a{background:var(--auto);color:var(--auto-ink)}.orig.m{background:var(--soft);color:var(--muted)}
pre.log{background:#0f1217;color:#cfd6e2;border-radius:8px;padding:10px;height:280px;overflow:auto;font-size:12px;margin:8px 0 0;white-space:pre-wrap}
progress{width:100%;height:12px}
iframe.vis{width:100%;height:calc(100vh - 190px);min-height:600px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
svg.spark{width:100%;height:70px;display:block}
.galeria a{font-size:12.5px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(720px,95vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#dlgIdioma{width:min(580px,95vw);padding:28px 26px;text-align:center}
#dlgIdioma img{width:84px;height:84px}
#dlgIdioma h2{margin:8px 0 2px;font-size:24px}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.escolhas button{padding:16px 10px;font-size:16px;font-weight:600;border-width:1.5px;border-radius:12px}
.escolhas button small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}
.inicio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;text-align:left}
.inicio button{text-align:left;padding:12px 14px;border-radius:12px}
.inicio button b{display:block;margin-bottom:2px}.inicio button span{font-size:12.5px;color:var(--muted)}
.abas{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.aba{border-radius:999px;padding:7px 16px;font-weight:600}
.aba.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
svg.atividade{width:100%;height:96px;display:block;margin-top:8px}
.exemplos{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
</style>
</head>
<body>
<header>
  <div class="marca"><img src="/logo.svg" alt=""><div><h1>Moby-DIC</h1><div class="sub" id="slogan"></div></div></div>
  <div class="acoes"><span id="cabStatus"></span>
    <select id="idioma" aria-label="Idioma / Language"><option value="pt">Português</option><option value="en">English</option></select>
    <button id="ajuda" class="peq"></button><button id="sobre" class="peq"></button><button id="encerrar" class="peq"></button></div>
</header>
<div class="app">
  <nav class="fluxo" id="fluxo"></nav>
  <main id="conteudo"></main>
</div>
<dialog id="dlgPasta"><h3 id="dlgTitulo" style="margin-top:0"></h3><div id="dlgCorpo"></div>
  <div class="nav"><span></span><div><button id="dlgCancelar"></button> <button class="prim" id="dlgOk"></button></div></div></dialog>
<dialog id="dlgIdioma"><img src="/logo.svg" alt=""><h2>Moby-DIC</h2><div class="nota" id="idiomaSub">Choose your language · Escolha o idioma</div>
  <div id="idiomaCorpo"><div class="escolhas"><button data-l="en">English<small>Interface, logs and figures in English</small></button>
    <button data-l="pt">Português<small>Interface, mensagens e figuras em português</small></button></div>
    <p class="nota" style="margin-top:16px">You can change it later in the top bar · Pode ser alterado depois na barra superior</p></div></dialog>
<dialog id="dlgSobre"><div id="sobreCorpo"></div><div class="nav"><span></span><button id="sobreOk">OK</button></div></dialog>
<script>
// ------------------------------------------------------------------ idioma
let LANG = "pt";
const tr = (pt, en) => LANG === "en" ? en : pt;
const $ = (s, r=document) => r.querySelector(s);
const ERROS = {busy:["Já existe uma análise em andamento.","An analysis is already running."], nome_invalido:["Nome de pasta de saída inválido.","Invalid output folder name."],
  ja_existe:["A pasta de saída já existe; escolha outro nome.","The output folder already exists; choose another name."],
  sem_resultado:["A pasta não contém resultados do Moby-DIC.","The folder does not contain Moby-DIC results."]};
const api = async (url, corpo) => { const r = await fetch(url, corpo ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corpo)} : {});
  const j = await r.json().catch(() => ({erro:"?"})); if (!r.ok) { const e = ERROS[j.erro]; throw new Error(e ? tr(...e) : (j.erro || r.statusText)); } return j; };
const num = (v, d=2) => (+v).toLocaleString(LANG === "en" ? "en-US" : "pt-BR", {maximumFractionDigits:d});

// ------------------------------------------------------------------ estado
const S = {
  etapa: 0, feitas: new Set(), app: {}, prefs: {}, info: null,
  sel: {inicio:1, fim:null, a_cada:1, auto:true},
  escala: {valor:null, modo:"auto"},       // modo: auto (último usado) | manual | pixels
  roi: {img:null, fonte:"auto"},
  met: {tipo:"subsets", subset:25, passo:5, janela:5, a_subset:true, a_passo:true, a_janela:true, elemento:30, a_elemento:true, cpx:10, cpy:8, a_cp:true},
  ref: {modo:"automatica", a_cada:2, zncc_ref:0.98, zncc_ref_p05:0.95, falha_ref:0.003, zncc_min:0.8, igualar:false, a_igualar:true, resgate:true, a_avancado:true},
  pos: {idioma:"pt", cmap:"jet", saida:"", a_saida:true, trabalho:""},
  resultado: null,
  fonte: "imagens",                         // imagens | video
  video: {arquivo:null, info:null, inicio:0, fim:0, n:40, a_trecho:true, a_n:true},
  origemVideo: null,                        // {pasta, nome, inicio, fim, n}
};
const ETAPAS = () => [
  {t:tr("Imagens","Images"), d:tr("pasta e quadros","folder and frames"), f:etapaImagens},
  {t:tr("Escala","Scale"), d:tr("µm por pixel","µm per pixel"), f:etapaEscala},
  {t:tr("Região de interesse","Region of interest"), d:tr("ROI sobre a amostra","ROI on the specimen"), f:etapaROI},
  {t:tr("Método e malha","Method and grid"), d:tr("algoritmo e grade","algorithm and grid"), f:etapaMetodo},
  {t:tr("Referência","Reference"), d:tr("atualização e robustez","updating and robustness"), f:etapaReferencia},
  {t:tr("Saída","Output"), d:tr("pasta e visualizador","folder and viewer"), f:etapaSaida},
  {t:tr("Executar","Run"), d:tr("resumo e progresso","summary and progress"), f:etapaExecutar},
  {t:tr("Visualizar","View"), d:tr("mapas e animação","maps and animation"), f:etapaVisualizar},
];
const roiInferior = () => { const [x1, y1, x2, y2] = S.roi.img, h = S.info.altura; return [x1, h-1-y2, x2, h-1-y1]; };
const roiSuperior = r => { const h = S.info.altura; return [r[0], h-1-r[3], r[2], h-1-r[1]]; };
const nQuadros = () => S.info ? S.info.n_quadros : 0;
const escalaAtual = () => S.escala.modo === "pixels" ? null : S.escala.valor;
function aplicarAutomaticos(){
  const i = S.info; if (!i) return;
  if (S.roi.fonte === "auto" || !S.roi.img) { S.roi.img = roiSuperior(i.roi); S.roi.fonte = "auto"; }
  if (S.met.a_subset) S.met.subset = i.subset_px;
  if (S.met.a_passo) S.met.passo = i.passo_px;
  if (S.met.a_janela) S.met.janela = i.janela_deformacao;
  if (S.met.a_elemento) S.met.elemento = i.elemento_q4_px;
  if (S.ref.a_igualar) S.ref.igualar = i.igualar_nitidez;
  if (S.ref.a_avancado) Object.assign(S.ref, {zncc_ref:i.zncc_ref, zncc_ref_p05:i.zncc_ref_p05, falha_ref:i.falha_ref, zncc_min:i.zncc_min});
  if (S.escala.modo === "auto") S.escala.valor = S.prefs.escala_um_px || null;
  if (S.pos.a_saida) S.pos.saida = nomeSaida();
}
function nomeSaida(){
  const nome = (S.info?.pasta || "sample").split(/[\\/]/).filter(Boolean).pop().replace(/[^\w.-]+/g, "_");
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return `${nome}_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;
}

// ------------------------------------------------------------------ fluxo e componentes
function desenharFluxo(){
  const f = $("#fluxo"); f.innerHTML = ""; const et = ETAPAS();
  et.forEach((e, k) => {
    const livre = k === 0 || k === 7 || (S.info && (k < 6 || S.feitas.has(5)));
    const el = document.createElement("div");
    el.className = "no" + (k === S.etapa ? " ativo" : "") + (S.feitas.has(k) ? " feito" : "") + (livre ? "" : " bloqueado");
    el.innerHTML = `<div class="bola">${S.feitas.has(k) && k !== S.etapa ? "✓" : k+1}</div><div><div class="t">${e.t}</div><div class="d">${e.d}</div></div>`;
    if (livre) el.onclick = () => ir(k);
    f.appendChild(el);
    if (k < et.length-1){ const c = document.createElement("div"); c.className = "conector"; f.appendChild(c); }
  });
  f.insertAdjacentHTML("beforeend", `<div class="rodape">Moby-DIC ${S.app.versao || ""}</div>`);
}
function ir(k){ S.etapa = k; desenharFluxo(); const c = $("#conteudo"); c.innerHTML = ""; ETAPAS()[k].f(c); window.scrollTo({top:0}); }
function navegacao(c, {voltar=true, proximo=true, textoProx, antesProx=null} = {}){
  const n = document.createElement("div"); n.className = "nav";
  n.innerHTML = `<div>${voltar ? `<button class="voltar">← ${tr("Voltar","Back")}</button>` : ""}</div><div>${proximo ? `<button class="prim prox">${textoProx || tr("Próximo →","Next →")}</button>` : ""}</div>`;
  if (voltar) $(".voltar", n).onclick = () => ir(S.etapa - 1);
  if (proximo) $(".prox", n).onclick = async () => { if (antesProx && !(await antesProx())) return; S.feitas.add(S.etapa); ir(S.etapa + 1); };
  c.appendChild(n); return n;
}
function pilula(auto, aoMudar){
  const s = document.createElement("label"); s.className = auto ? "auto" : "manual";
  s.innerHTML = `<input type="checkbox" ${auto ? "checked" : ""}> ${auto ? tr("Automático","Automatic") : tr("Manual","Manual")}`;
  $("input", s).onchange = e => aoMudar(e.target.checked); return s;
}
function linhaParam(c, nome, ajuda, auto, aoAuto, controle){
  const l = document.createElement("div"); l.className = "campo";
  l.innerHTML = `<div class="nome">${nome}</div><div class="pil"></div><div class="ctl"></div><div class="ajuda">${ajuda}</div>`;
  if (auto !== null) $(".pil", l).appendChild(pilula(auto, aoAuto));
  $(".ctl", l).appendChild(controle); c.appendChild(l); return l;
}
function entradaNum(valor, {min, max, passo=1, desativada=false, aoMudar}){
  const e = document.createElement("input"); e.type = "number"; e.value = valor ?? ""; if (min != null) e.min = min; if (max != null) e.max = max;
  e.step = passo; e.disabled = desativada; e.onchange = () => aoMudar(+e.value); return e;
}
// Navegador de pastas reutilizável (lista + caminho). opcoes: {aoEntrar(r)}
async function navegador(el, inicial, {aoEntrar, videos = false, aoVideo} = {}){
  el.innerHTML = `<div class="lin"><input type="text" class="nvCam"><button class="peq nvAbrir">${tr("Abrir","Open")}</button></div>
    <div class="lin nvAtalhos"></div><div class="lista nvLista"></div>`;
  const listar = async (caminho) => {
    try {
      const r = await api("/api/pastas?caminho=" + encodeURIComponent(caminho || ""));
      el.dataset.caminho = r.caminho; $(".nvCam", el).value = r.caminho;
      $(".nvAtalhos", el).innerHTML = (r.pai ? `<button class="peq" data-c="${encodeURIComponent(r.pai)}">↑ ${tr("Pasta acima","Up")}</button>` : "") +
        r.atalhos.map(a => `<button class="peq" data-c="${encodeURIComponent(a.caminho)}">${a.nome}</button>`).join("") +
        r.unidades.map(u => `<button class="peq" data-c="${encodeURIComponent(u)}">${u}</button>`).join("");
      const rotulo = p => videos ? (p.n_videos ? p.n_videos + " " + tr("vídeos","videos") : "")
        : p.resultado ? tr("resultado Moby-DIC","Moby-DIC result") : p.n_imagens ? p.n_imagens + " " + tr("imagens","images") : "";
      const classe = p => videos ? (p.n_videos ? "img" : "") : p.resultado ? "res" : p.n_imagens ? "img" : "";
      $(".nvLista", el).innerHTML = (r.pastas.map(p => `<div data-c="${encodeURIComponent(p.caminho)}"><span>📁 ${p.nome}</span><span class="badge ${classe(p)}">${rotulo(p)}</span></div>`).join("")
        + (videos ? (r.videos || []).map(v => `<div data-v="${encodeURIComponent(v.caminho)}"><span>🎬 ${v.nome}</span><span class="badge img">${num(v.mb, 1)} MB</span></div>`).join("") : ""))
        || `<div><span class="nota">${videos ? tr("sem subpastas nem vídeos","no subfolders or videos") : tr("sem subpastas","no subfolders")}</span></div>`;
      el.querySelectorAll("[data-c]").forEach(d => d.onclick = () => listar(decodeURIComponent(d.dataset.c)));
      el.querySelectorAll("[data-v]").forEach(d => d.onclick = () => { el.querySelectorAll("[data-v]").forEach(x => x.style.background = "");
        d.style.background = "var(--soft)"; if (aoVideo) aoVideo(decodeURIComponent(d.dataset.v)); });
      if (aoEntrar) aoEntrar(r);
    } catch(e) { if (aoEntrar) aoEntrar({erro: e.message}); }
  };
  $(".nvAbrir", el).onclick = () => listar($(".nvCam", el).value);
  $(".nvCam", el).onkeydown = e => { if (e.key === "Enter") listar($(".nvCam", el).value); };
  await listar(inicial);
}
function escolherPasta(titulo, inicial){
  return new Promise(res => {
    const d = $("#dlgPasta"); $("#dlgTitulo").textContent = titulo; $("#dlgOk").textContent = tr("Escolher esta pasta","Choose this folder");
    $("#dlgCancelar").textContent = tr("Cancelar","Cancel");
    navegador($("#dlgCorpo"), inicial);

const disponiveisVideo = () => { const v = S.video, f = v.info.fps; return Math.max(0, Math.min(Math.round(v.fim*f), v.info.n_quadros - 1) - Math.round(v.inicio*f) + 1); };
function nRecomendado(){
  // mesmo critério do servidor: um quadro a cada ~5 px de movimento da região mais rápida no trecho
  const v = S.video, i = v.info, c = i.curva;
  // movimento no trecho: cada intervalo amostrado pesa pela fração que cai dentro do trecho; o salto da ruptura não conta
  const mov = c.mov_px.reduce((s, m, k) => { if (k === c.k_ruptura) return s;
    const f = Math.max(0, Math.min(v.fim, c.t1[k]) - Math.max(v.inicio, c.t0[k]))/Math.max(1e-9, c.t1[k] - c.t0[k]); return s + f*m; }, 0);
  const n = Math.max(i.n_min, Math.min(i.n_max, Math.round((v.a_trecho ? i.movimento_total_px : mov)/i.px_por_quadro) + 1));
  return {n: Math.min(n, disponiveisVideo()), mov: v.a_trecho ? i.movimento_total_px : mov};
}
function autoVideo(){
  const v = S.video, i = v.info;

}
function graficoAtividade(){
  const v = S.video, i = v.info, c = i.curva, w = 320, h = 90, T = i.duracao_s || 1;
  const mx = Math.max(...c.mov_px, i.limiar_px * 2, 1e-3), X = t => t/T*w, Y = m => h - 14 - Math.sqrt(m/mx)*(h - 22);
  const pts = c.t.map((t, k) => `${X(t).toFixed(1)},${Y(c.mov_px[k]).toFixed(1)}`).join(" ");
  return `<svg class="atividade" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <rect x="${X(v.inicio)}" y="0" width="${Math.max(1, X(v.fim) - X(v.inicio))}" height="${h - 12}" fill="var(--auto)"/>
    <line x1="0" x2="${w}" y1="${Y(i.limiar_px)}" y2="${Y(i.limiar_px)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="0.8"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="1.8" points="${pts}"/>
    <text x="2" y="${h - 2}" font-size="9" fill="var(--muted)">0 s</text><text x="${w - 2}" y="${h - 2}" font-size="9" fill="var(--muted)" text-anchor="end">${num(T, 1)} s</text></svg>
    <div class="nota">${tr("Movimento entre instantes amostrados (escala raiz) · faixa verde: trecho escolhido · tracejado: limiar de ruído","Motion between sampled instants (square-root scale) · green band: chosen interval · dashed: noise threshold")}</div>`;
}

async function extrairVideo(){

function editorROI(cv, quadro, extra){

  function desenhar(){

    if (!extra){ ctx.fillStyle = "#48defa"; [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(([a,b]) => ctx.fillRect(a-5, b-5, 10, 10)); }

    const perto = (a, b) => Math.abs(a - b) < tol, dentro = x > x1 && x < x2 && y > y1 && y < y2;
    const lados = {l: perto(x, x1) && y > y1-tol && y < y2+tol, r: perto(x, x2) && y > y1-tol && y < y2+tol,

    const av = document.createElement("details"); av.innerHTML = `<summary class="nota" style="cursor:pointer;margin-top:8px">${tr("Limiares avançados","Advanced thresholds")}</summary><div class="cAv"></div>`; p.appendChild(av);
    const cav = $(".cAv", av);
    linhaParam(cav, tr("Limiares","Thresholds"), tr("Automático: ZNCC mediana 0,98, ZNCC p05 0,95, falhas 0,3 %, ZNCC mínima por ponto 0,8.","Automatic: median ZNCC 0.98, p05 ZNCC 0.95, failures 0.3 %, minimum ZNCC per point 0.8."), r.a_avancado, v => { r.a_avancado = v; aplicarAutomaticos(); ir(4); }, document.createElement("span"));
    [["zncc_ref", tr("ZNCC mediana para trocar","Median ZNCC to update"), 0.01], ["zncc_ref_p05", tr("ZNCC p05 para trocar","p05 ZNCC to update"), 0.01], ["falha_ref", tr("Fração de falhas para trocar","Failure fraction to update"), 0.001], ["zncc_min", tr("ZNCC mínima aceita por ponto","Minimum accepted ZNCC per point"), 0.01]]
      .forEach(([k, n, ps]) => linhaParam(cav, n, "", null, null, entradaNum(r[k], {min:0, max:1, passo:ps, desativada:r.a_avancado, aoMudar:v => r[k] = v})));
    av.open = !r.a_avancado;
  }
  navegacao($(".etapa", c));
}

// ------------------------------------------------------------------ 6. saída
function etapaSaida(c){
  const p = S.pos;
  if (!p.trabalho) p.trabalho = S.prefs.pasta_trabalho;
  c.innerHTML = `<div class="etapa"><h2>6. ${tr("Saída","Output")}</h2><p class="lead">${tr("Onde os resultados são gravados e como o visualizador abre.","Where results are written and how the viewer opens.")}</p><div class="card" id="cPos"></div></div>`;
  const cp = $("#cPos");
  const trab = document.createElement("span"); trab.className = "lin"; trab.style.margin = 0;
  trab.innerHTML = `<code style="word-break:break-all">${p.trabalho}</code> <button class="peq">${tr("Alterar…","Change…")}</button>`;
  $("button", trab).onclick = async () => { const r = await escolherPasta(tr("Pasta de trabalho","Working folder"), p.trabalho); if (r){ p.trabalho = r; ir(5); } };
  linhaParam(cp, tr("Pasta de trabalho","Working folder"), tr("Cada análise cria uma subpasta aqui.","Each analysis creates a subfolder here."), null, null, trab);
  const sd = document.createElement("input"); sd.type = "text"; sd.value = p.saida; sd.disabled = p.a_saida; sd.onchange = () => p.saida = sd.value.trim();
  linhaParam(cp, tr("Nome da análise","Analysis name"), tr("Automático: <pasta das imagens>_<data-hora>.","Automatic: <image folder>_<date-time>."), p.a_saida, v => { p.a_saida = v; aplicarAutomaticos(); ir(5); }, sd);
  const idi = document.createElement("select"); idi.innerHTML = `<option value="pt">Português</option><option value="en">English</option>`; idi.value = p.idioma; idi.onchange = () => p.idioma = idi.value;
  linhaParam(cp, tr("Idioma inicial do visualizador","Viewer initial language"), tr("Pode ser trocado depois na própria página.","Can be changed later on the page itself."), null, null, idi);
  const cm = document.createElement("select"); cm.innerHTML = ["jet","whitejet","turbo","viridis","plasma","inferno","magma","cividis","coolwarm","RdBu_r","seismic","bwr","gray"].map(x => `<option>${x}</option>`).join(""); cm.value = p.cmap; cm.onchange = () => p.cmap = cm.value;
  linhaParam(cp, tr("Colormap inicial","Initial colormap"), tr("Pode ser trocado depois.","Can be changed later."), null, null, cm);
  navegacao($(".etapa", c), {antesProx: async () => { if (!/^[\w.\- ]+$/.test(p.saida)){ alert(tr("Nome inválido: use letras, números, espaço, ponto, hífen ou sublinhado.","Invalid name: use letters, digits, space, dot, hyphen or underscore.")); return false; } return true; }});
}

// ------------------------------------------------------------------ 7. executar
function configuracao(){
  const i = S.info, m = S.met, r = S.ref, p = S.pos;
  return {pasta:i.pasta, n_quadros:i.n_quadros, selecao:{inicio:S.sel.inicio, fim:S.sel.fim, a_cada:S.sel.a_cada},
    escala_um_px:escalaAtual(), roi:roiInferior(), roi_imagem:S.roi.img,
    metodo:{tipo:m.tipo, subset_px:m.subset, passo_px:m.passo, janela_deformacao:m.janela, elemento_px:m.elemento, pontos_controle:[m.cpx, m.cpy]},
    referencia:{modo:r.modo, a_cada:r.a_cada, zncc_ref:r.zncc_ref, zncc_ref_p05:r.zncc_ref_p05, falha_ref:r.falha_ref, zncc_min:r.zncc_min, igualar_nitidez:r.igualar, resgate:r.resgate},
    pos:{idioma:p.idioma, cmap:p.cmap}, pasta_trabalho:p.trabalho, saida:p.saida,
    origem:{selecao:S.sel.auto, escala:S.escala.modo, roi:S.roi.fonte, subset:m.a_subset, passo:m.a_passo, janela:m.a_janela}};
}
let timerStatus = null;
const ETAPA_TXT = {correlacao:["Correlação","Correlation"], visualizador:["Gerando o visualizador","Building the viewer"], concluida:["Concluída","Finished"], cancelada:["Cancelada","Cancelled"]};
function etapaExecutar(c){
  const i = S.info, m = S.met, r = S.ref, p = S.pos, o = a => `<span class="orig ${a ? "a" : "m"}">${a ? "auto" : "manual"}</span>`;
  const [x1,y1,x2,y2] = S.roi.img.map(Math.round);
  const metTxt = m.tipo === "subsets" ? `${tr("DIC por subsets","Subset DIC")} · subset ${m.subset} px ${o(m.a_subset)} · ${tr("passo","step")} ${m.passo} px ${o(m.a_passo)} · ${tr("janela","window")} ${m.janela} ${o(m.a_janela)}`
    : m.tipo === "q4" ? `muDIC Q4 · ${tr("elemento","element")} ${m.elemento} px ${o(m.a_elemento)}` : `muDIC B-spline · ${m.cpx} × ${m.cpy} ${o(m.a_cp)}`;
  const refTxt = {automatica:tr("automática","automatic"), a_cada:tr(`a cada ${r.a_cada} quadros`, `every ${r.a_cada} frames`), fixa:tr("fixa no primeiro quadro","fixed at the first frame")}[r.modo];
  const escTxt = escalaAtual() ? `${num(escalaAtual(), 4)} µm/px ${o(S.escala.modo === "auto")}` : tr("sem calibração (pixels)","uncalibrated (pixels)");
  c.innerHTML = `<div class="etapa"><h2>7. ${tr("Executar","Run")}</h2><p class="lead">${tr("Confira a configuração e inicie. A análise roda neste computador.","Check the configuration and start. The analysis runs on this computer.")}</p>
    <div class="card"><table class="resumo">
      <tr><td>${tr("Imagens","Images")}</td><td>${i.pasta}<br>${i.n_quadros} ${tr("quadros","frames")} (${S.sel.inicio}–${S.sel.fim || i.n_imagens_pasta}, ${tr("a cada","every")} ${S.sel.a_cada}) ${o(S.sel.auto)}</td></tr>
      <tr><td>${tr("Escala","Scale")}</td><td>${escTxt}</td></tr>
      <tr><td>ROI (px)</td><td>x ${x1}–${x2}, y ${y1}–${y2} · ${x2-x1} × ${y2-y1} px ${o(S.roi.fonte === "auto")}</td></tr>
      <tr><td>${tr("Método","Method")}</td><td>${metTxt}</td></tr>
      <tr><td>${tr("Referência","Reference")}</td><td>${refTxt}${m.tipo === "subsets" ? ` · ${tr("igualar nitidez","sharpness matching")}: ${r.igualar ? tr("sim","yes") : tr("não","no")} ${o(r.a_igualar)} · ${tr("resgate","rescue")}: ${r.resgate ? tr("sim","yes") : tr("não","no")}` : ""}</td></tr>
      <tr><td>${tr("Saída","Output")}</td><td>${p.trabalho}\\${p.saida}<br>${tr("visualizador","viewer")} ${p.idioma.toUpperCase()}, ${p.cmap}</td></tr></table>
      <div class="nav"><button id="voltar7">← ${tr("Voltar","Back")}</button><div><button id="cancelar" hidden>${tr("Cancelar","Cancel")}</button> <button class="prim" id="rodar">▶ ${tr("Iniciar análise","Start analysis")}</button></div></div></div>
    <div class="card" id="cProg" hidden><h3 id="etapaTxt"></h3><progress id="barra" value="0" max="1"></progress><div class="nota" id="progTxt"></div><pre class="log" id="log"></pre>
      <div class="nav"><button class="peq" id="abrirPasta" hidden>${tr("Abrir pasta dos resultados","Open results folder")}</button><button class="prim" id="abrirVis" hidden>${tr("Abrir no visualizador →","Open in the viewer →")}</button></div></div></div>`;
  $("#voltar7").onclick = () => ir(5);
  $("#rodar").onclick = async () => { try { const r2 = await api("/api/executar", configuracao()); S.resultado = r2.saida; $("#rodar").disabled = true; acompanhar(); } catch(e) { alert(e.message); } };
  $("#cancelar").onclick = () => api("/api/cancelar", {});
  $("#abrirVis").onclick = () => { S.feitas.add(6); ir(7); };
  $("#abrirPasta").onclick = () => api("/api/abrir_pasta", {pasta:S.resultado});
  acompanhar(true);
}
async function acompanhar(soUmaVez){
  clearInterval(timerStatus);
  const atualizar = async () => {
    const s = await api("/api/status");
    $("#cabStatus").textContent = s.estado === "rodando" ? tr("Análise em andamento…","Analysis running…") : "";
    const card = $("#cProg"); if (!card || s.estado === "parada") return s;
    card.hidden = false;
    const et = ETAPA_TXT[s.etapa]; $("#etapaTxt").textContent = et ? tr(...et) : tr("Erro: ","Error: ") + s.etapa;
    $("#barra").max = s.total; $("#barra").value = s.etapa === "correlacao" ? s.progresso : s.total;
    $("#progTxt").textContent = s.etapa === "correlacao" ? tr(`quadro ${s.progresso} de ${s.total}`, `frame ${s.progresso} of ${s.total}`) : "";
    const lg = $("#log"), fim = lg.scrollTop + lg.clientHeight >= lg.scrollHeight - 20; lg.textContent = s.log.join("\n"); if (fim) lg.scrollTop = lg.scrollHeight;
    $("#cancelar").hidden = s.estado !== "rodando"; $("#rodar").disabled = s.estado === "rodando";
    if (s.estado === "concluida"){ S.resultado = s.saida; $("#abrirVis").hidden = false; $("#abrirPasta").hidden = false; S.feitas.add(6); desenharFluxo(); }
    return s;
  };
  const s = await atualizar();
  if (s.estado === "rodando" || !soUmaVez) timerStatus = setInterval(async () => { const e = await atualizar(); if (e.estado !== "rodando") clearInterval(timerStatus); }, 1000);
}

// ------------------------------------------------------------------ 8. visualizar
async function etapaVisualizar(c){
  c.innerHTML = `<div class="etapa" style="max-width:none"><h2>8. ${tr("Visualizar","View")}</h2>
    <div class="lin"><label>${tr("Resultado","Result")} <select id="resSel"></select></label>
      <button class="peq" id="abrirOutro">${tr("Abrir resultado de outra pasta…","Open a result from another folder…")}</button>
      <a id="novaAba" target="_blank">${tr("abrir em nova aba ↗","open in a new tab ↗")}</a><button class="peq" id="pastaRes">${tr("abrir pasta","open folder")}</button><span class="nota" id="resInfo"></span></div>
    <div class="galeria nota" id="galeria"></div><iframe class="vis" id="vis"></iframe></div>`;
  $("#abrirOutro").onclick = async () => { const p = await escolherPasta(tr("Pasta de um resultado do Moby-DIC","Folder of a Moby-DIC result"), S.prefs.pasta_trabalho);
    if (!p) return; try { const r = await api("/api/abrir_resultado", {pasta:p}); S.resultado = r.caminho; ir(7); } catch(e) { alert(e.message); } };
  const lista = await api("/api/resultados"), sel = $("#resSel");
  if (!lista.length){ $("#vis").remove(); $("#novaAba").remove(); $("#pastaRes").remove(); c.querySelector(".etapa").insertAdjacentHTML("beforeend", `<p class="nota">${tr("Nenhum resultado ainda. Rode uma análise ou abra um resultado existente.","No results yet. Run an analysis or open an existing result.")}</p>`); return; }
  sel.innerHTML = lista.map((r, k) => `<option value="${k}">${r.nome} · ${r.data}</option>`).join("");
  const k0 = lista.findIndex(r => S.resultado && r.caminho.toLowerCase() === S.resultado.toLowerCase()); if (k0 >= 0) sel.value = k0;
  const url = (r, f) => `/res?d=${encodeURIComponent(r.caminho)}&f=${encodeURIComponent(f)}`;
  const abrir = () => { const r = lista[+sel.value], u = url(r, "visualizador.html") + "&lang=" + LANG;
    $("#vis").src = u; $("#novaAba").href = u; $("#pastaRes").onclick = () => api("/api/abrir_pasta", {pasta:r.caminho});
    $("#resInfo").textContent = `${tr(r.metodo, r.metodo_en || r.metodo)} · ${r.quadros} ${tr("quadros","frames")}`;
    $("#galeria").innerHTML = r.figuras.length ? tr("Figuras: ","Figures: ") + r.figuras.map(f => `<a target="_blank" href="${url(r, f)}">${f}</a>`).join(" · ") : ""; };
  sel.onchange = abrir; abrir();
}

// ------------------------------------------------------------------ cabeçalho
function textosFixos(){
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
  $("#slogan").textContent = tr("Correlação digital de imagens para ensaios mecânicos","Digital image correlation for mechanical testing");
  $("#sobre").textContent = tr("Sobre","About"); $("#encerrar").textContent = tr("Encerrar","Quit");
  $("#ajuda").textContent = tr("Documentação","Documentation"); $("#ajuda").title = tr("Manual, teoria e tutoriais (em inglês)","User guide, theory and tutorials");
}
function sobre(){
  $("#sobreCorpo").innerHTML = `<div class="marca" style="color:inherit"><img src="/logo.svg" style="width:56px"><div><h2 style="margin:0">Moby-DIC ${S.app.versao}</h2>
    <div class="nota">${tr("Correlação digital de imagens 2D","2D digital image correlation")}</div></div></div>
    <p>${tr("Método principal: DIC local por subsets (IC-GN, ZNSSD, função de forma afim, interpolação B-spline cúbica), referência atualizada automaticamente, recuperação de pontos e tratamento de refoco. Deformações logarítmicas a partir de ajuste local de plano aos deslocamentos.","Main method: local subset DIC (IC-GN, ZNSSD, affine shape function, cubic B-spline interpolation), automatic reference updating, point recovery and refocus handling. Logarithmic strains from a local plane fit to displacements.")}</p>
    <p class="nota">${tr("Sistema de coordenadas dos resultados: origem no canto inferior esquerdo da imagem, x para a direita, y para cima.","Result coordinate system: origin at the lower-left image corner, x to the right, y up.")}<br>
    ${tr("Configuração do usuário","User settings")}: <code>%APPDATA%\\Moby-DIC</code> · muDIC: ${S.app.mudic ? tr("disponível","available") : tr("não instalado","not installed")}</p>
    <p class="nota">© 2026 João Felipe · ${tr("Software livre sob a licença MIT","Free software under the MIT License")} · <a href="/docs/" target="_blank">${tr("Documentação","Documentation")}</a></p>`;
  $("#dlgSobre").showModal(); $("#sobreOk").onclick = () => $("#dlgSobre").close();
}

async function escolherIdioma(){
  const temVideo = (await api("/api/info/video").catch(() => ({}))).video;
  return new Promise(res => {
    const d = $("#dlgIdioma");
    d.addEventListener("cancel", e => e.preventDefault());
    d.querySelectorAll("[data-l]").forEach(b => b.onclick = async () => {
      LANG = b.dataset.l; await api("/api/prefs", {idioma:LANG}).catch(() => {}); S.prefs.idioma = LANG;
      $("#idioma").value = LANG; textosFixos();
      $("#idiomaSub").textContent = tr("Correlação digital de imagens para ensaios mecânicos","Digital image correlation for mechanical testing");
      $("#idiomaCorpo").innerHTML = `<div class="inicio">
        <button data-a="imagens"><b>${tr("Analisar minhas imagens","Analyse my images")}</b><span>${tr("Escolher a pasta da sequência do ensaio","Choose the folder with the test sequence")}</span></button>
        <button data-a="exemplo"><b>${tr("Experimentar um exemplo","Try an example")}</b><span>${tr("Sequência sintética de tração com estricção","Synthetic tension sequence with necking")}</span></button>
        <button data-a="docs"><b>${tr("Ler a documentação","Read the documentation")}</b><span>${tr("Guia, teoria e tutoriais (em inglês)","User guide, theory and tutorials")}</span></button>
        ${temVideo ? `<button data-a="video"><b>${tr("Ver o vídeo tutorial","Watch the video tutorial")}</b><span>${tr("Primeira análise, passo a passo (4 min, em inglês)","Your first analysis, step by step (4 min)")}</span></button>` : ""}</div>`;
      $("#idiomaCorpo").querySelectorAll("[data-a]").forEach(x => x.onclick = () => { d.close(); res(x.dataset.a); });
    });
    d.showModal();
  });
}
(async function(){
  S.app = await api("/api/info"); S.prefs = S.app.prefs;
  let acao = null;
  LANG = (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en"; $("#idioma").value = LANG; textosFixos();
  if (S.prefs.idioma === "pt" || S.prefs.idioma === "en") LANG = S.prefs.idioma;
  else acao = await escolherIdioma();
  S.pos.idioma = LANG;
  $("#idioma").value = LANG; textosFixos();
  $("#idioma").onchange = e => { LANG = e.target.value; S.pos.idioma = LANG; api("/api/prefs", {idioma:LANG}); textosFixos(); ir(S.etapa); };
  $("#sobre").onclick = sobre;
  $("#ajuda").onclick = () => window.open("/docs/", "_blank");
  $("#encerrar").onclick = async () => { if (!confirm(tr("Encerrar o Moby-DIC?","Quit Moby-DIC?"))) return; await api("/api/encerrar", {}).catch(() => {});
    document.body.innerHTML = `<p style="padding:40px;font:16px system-ui">${tr("Moby-DIC encerrado. Pode fechar esta aba.","Moby-DIC has closed. You can close this tab.")}</p>`; };
  if (S.prefs.escala_um_px) { S.escala.modo = "auto"; S.escala.valor = S.prefs.escala_um_px; } else S.escala.modo = "manual";
  ir(0); acompanhar(true);
  if (acao === "exemplo") abrirExemplo("necking", null);
  if (acao === "docs") window.open("/docs/", "_blank");
  if (acao === "video") window.open("/tutorial.mp4", "_blank");
})();
</script>
